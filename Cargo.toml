[package]
name = "roaring_knight"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlCanvasElement", "HtmlImageElement", "KeyboardEvent", "Event", "EventTarget",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlTexture", "WebGlFramebuffer",
  "WebGlUniformLocation", "WebGlVertexArrayObject", "WebGlContextAttributes",
  "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioParam", "GainNode", "AudioDestinationNode", "BaseAudioContext",
  "Response", "Performance", "console", "CssStyleDeclaration", "HtmlElement", "Storage", "Location", "UrlSearchParams"
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
