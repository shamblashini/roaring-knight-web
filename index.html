<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Roaring Knight</title>
<link data-trunk rel="rust" data-wasm-opt="z" />
<link data-trunk rel="copy-dir" href="assets" />
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #disclaimer { position: fixed; left: 0; right: 0; bottom: 8px; display: none; text-align: center;
                color: #8a8a8a; font: 12px/1.45 monospace; padding: 0 16px; pointer-events: none; }
  #disclaimer a { color: #b5b5b5; pointer-events: auto; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff;
             font: 16px monospace; letter-spacing: 2px; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="loading">LOADING...</div>

</html>
